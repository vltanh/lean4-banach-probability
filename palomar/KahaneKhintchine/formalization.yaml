version: "v0.4"

project:
  name: "Hypercontractivity on the cube and the Kahane-Khintchine inequality, in Lean"
  description: >-
    Lean 4 proofs, from Mathlib alone, of inequalities for functions of independent fair signs with
    values in a seminormed space: hypercontractivity of the discrete heat semigroup, ||T(t) f||_q <=
    ||f||_p for 1 < p <= q and e^(-t) <= ((p - 1)/(q - 1))^(1/2), with Bonami's inequality for one
    sign (Hytönen, van Neerven, Veraar and Weis, "Analysis in Banach Spaces II", Theorem 6.2.2 and
    Lemma 6.2.3); the Kahane-Khintchine inequality, with the constant ((q - 1)/(p - 1))^(1/2) for 1
    < p <= q, and with some constant for all exponents 0 < p, q < infinity (Theorem 6.2.4); and
    Borell's inequality ||c + rho S||_q <= ||c + S||_p, rho = ((p - 1)/(q - 1))^(1/2), for
    Rademacher sums S.


    Also Kahane's contraction principle for Rademacher sums with real coefficients, and with complex
    ones and the factor pi/2 ("Analysis in Banach Spaces I", Proposition 3.2.10).
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

classification:
  arxiv: ["math.PR", "math.FA"]
  msc2020: ["46B09", "60E15", "60B11", "47D07", "68V20"]

