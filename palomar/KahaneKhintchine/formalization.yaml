status:
  scope: >-
    Formalized (the 9 theorems that Comparator checks): the discrete heat semigroup on Walsh
    functions; its hypercontractivity and Bonami's inequality; affine hypercontractivity of
    Rademacher sums; the Kahane-Khintchine inequality with an explicit constant for 1 < p <= q and
    with some constant for all positive exponents; Kahane's contraction principle with real and with
    complex coefficients; that the norm used is the L^p norm for the uniform probability on the
    cube.


    Not formalized: the necessity of the conditions on the exponents; Walsh polynomials of degree at
    least 2; complex Rademacher variables and the constants for them; the case p = infinity of the
    contraction principle, and the optimality of pi/2; sharp constants.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code 2.1.330 (VS Code extension, Claude Agent SDK)"
      tool_setup: >-
        The formalize-math-paper skill (https://github.com/vltanh/formalize-math-paper, version
        4.3.2, commit 8e884d5); Claude Code sessions and sub-agents that wrote the statements and
        the proofs of the library and compared them with the sources; the number of agents was not
        tracked for this library alone. This entry by one agent, with an independent reviewer agent.
        Lean v4.36.0-rc2, Mathlib v4.36.0-rc2.
      cost:
        wall_time: >-
          about 13 hours between the library's first commit and its last one before the entries
          (21-22 November 2026, git log), not continuous and with other work in parallel, and about
          1.5 hours for the eight entries of the package together, with the additions to the library
          that they needed and the review; agent time not tracked
        spend_usd: "not tracked"
        hardware: "local machine (20 cores, 62 GB RAM) and API"
      prompting_notes: >-
        Instructions: state the theorems of the cited sources in their general form as far as
        feasible, follow the sources' proofs, record every deviation, use only Mathlib.
  spend_usd: "not tracked"
  notes: >-
    The AI system wrote the code and the documents. No person has reviewed the statements or the
    proofs; Lean has checked the proofs. Independent AI agents compared the proofs of the library
    with the cited sources, and one compared the statements of this entry with them.

fidelity:
  divergences: >-
    Statements. The Rademacher variables are real and are the coordinates of the finite sign cube
    with the uniform probability, for finitely many variables. The values are in a real vector space
    with a seminorm (the books: Banach spaces); for the contraction principle in a normed space. The
    discrete heat semigroup is defined as the tensor power of Borell's operator, (6.7), and its
    action on the Walsh functions, (6.6), by which the book defines it, is a theorem. Theorem 6.2.2
    and Lemma 6.2.3: only the "if" parts, the former as the inequality for every function, for every
    real t with e^(-t) at most the bound (so t >= 0). The case p = q is included everywhere (Lemma
    6.2.3, Theorem 6.2.4 and Borell's inequality have p < q). Theorem 6.2.4: the real case; the
    constants kappa_{q,p} for the exponents outside 1 < p <= q are not made explicit, and the
    trivial case q <= p is included. Proposition 3.2.10: real signs, so for real coefficients the
    first estimate with real Rademacher variables and for complex ones the second; p < infinity; max
    |a_n| is replaced by any bound of the coefficients. Borell's (2.1): for polynomials of degree at
    most 1, and for the largest admissible parameter.


    Proofs. Those of HNVW; an edge case of Lemma 6.2.3 (|y| = 1), where the book uses the binomial
    series on the boundary of its disc, is obtained by continuity. Borell's inequality by his
    argument, with the results that he cites proved after O'Donnell.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (independent agents)"
  notes: >-
    No human review. Independent AI agents compared the proofs of the library with the cited
    sources. Another one compared the statements of this entry, and this file, with them and found
    no wrong and no vacuous statement; its remarks on generality, citations and wording were
    followed, and it checked the corrected entry again, with a few further remarks on citations and
    wording, none on a theorem statement, which were followed.

alignment:
  namespace: "KahaneKhintchineChallenge"
  statements:
    - source: "a check of the definitions"
      lean: "KahaneKhintchineChallenge.lpNorm_eq_eLpNorm"
      module: "KahaneKhintchine.Challenge"
      status: "proved"
      note: >-
        The norm of the sign cube is the L^p norm for the uniform probability.
    - source: "HNVW II, (6.6)"
      lean: "KahaneKhintchineChallenge.heatSemigroup_walsh"
      module: "KahaneKhintchine.Challenge"
      status: "proved"
      note: >-
        T(t)(sum w_alpha x_alpha) = sum e^(-t #alpha) w_alpha x_alpha; the book's definition.
    - source: "HNVW II, Theorem 6.2.2 (the 'if' part)"
      lean: "KahaneKhintchineChallenge.heatSemigroup_hypercontractive"
      module: "KahaneKhintchine.Challenge"
      status: "partial"
      note: >-
        The 'only if' part is not formalized. Seminormed values.
    - source: "HNVW II, Lemma 6.2.3 (the 'if' part)"
      lean: "KahaneKhintchineChallenge.bonami"
      module: "KahaneKhintchine.Challenge"
      status: "partial"
      note: >-
        The 'only if' part is not formalized. Seminormed values.
    - source: "Borell 1979, (2.1) for degree at most 1"
      lean: "KahaneKhintchineChallenge.hypercontractive_affine"
      module: "KahaneKhintchine.Challenge"
      status: "partial"
      note: >-
        Walsh polynomials of degree at most 1, with the largest admissible parameter.
    - source: "HNVW II, Theorem 6.2.4, 1 < p <= q, real signs"
      lean: "KahaneKhintchineChallenge.kahaneKhintchine"
      module: "KahaneKhintchine.Challenge"
      status: "partial"
      note: >-
        The bound ((q - 1)/(p - 1))^(1/2) of the book for real Rademacher variables.
    - source: "HNVW II, Theorem 6.2.4, all exponents, real signs"
      lean: "KahaneKhintchineChallenge.exists_kahaneKhintchine"
      module: "KahaneKhintchine.Challenge"
      status: "partial"
      note: >-
        Real Rademacher variables.
    - source: "HNVW I, Proposition 3.2.10 (real scalars)"
      lean: "KahaneKhintchineChallenge.contraction_real"
      module: "KahaneKhintchine.Challenge"
      status: "partial"
      note: >-
        Real coefficients and signs, 1 <= p < infinity.
    - source: "HNVW I, Proposition 3.2.10, (3.15)"
      lean: "KahaneKhintchineChallenge.contraction_complex"
      module: "KahaneKhintchine.Challenge"
      status: "partial"
      note: >-
        Complex coefficients and real signs, 1 <= p < infinity; not the optimality of pi/2.

