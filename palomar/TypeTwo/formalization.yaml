    authors:
      - "Tuomas Hytönen"
      - "Jan van Neerven"
      - "Mark Veraar"
      - "Lutz Weis"
    id: "Ergebnisse der Mathematik und ihrer Grenzgebiete (3) 67, Springer (2017)"
    type: "book"
    location: "https://doi.org/10.1007/978-3-319-69808-3"
    relationship: "formalizes"
    note: >-
      Proposition 7.1.18 (1) (pp. 67-68) for p = 2 and real Gaussian variables, with Propositions
      6.1.11, 6.1.15 and 7.1.16 (1) for them; Proposition 7.4.22 (p. 124), by its proof, with
      Theorems 6.1.13 (i) and 7.1.20 (2) in the cases that it uses; Example 7.1.2 (type 2 of Hilbert
      spaces). The definitions are 7.1.1, 7.1.17, 7.4.1 and 7.4.4.
    author_endorsement: "not-contacted"
  - title: "The moduli of smoothness and convexity and the Rademacher averages of trace classes S_p (1 <= p < infinity)"
    authors:
      - "Nicole Tomczak-Jaegermann"
    id: "Studia Math. 50 (1974), 163-182"
    type: "paper"
    location: "https://zbmath.org/?q=an:0282.46016"
    relationship: "formalizes"
    note: >-
      Theorem 3.1 (ii) (p. 172), by its proof (pp. 176-179), with Lemma 1.1 (the general Horn
      inequality) and Proposition 1.2 (the three lines theorem), for square matrices.
    author_endorsement: "not-contacted"
  - title: "Non-commutative vector valued L_p-spaces and completely p-summing maps"
    authors:
      - "Gilles Pisier"
    id: "Astérisque 247 (1998)"
    type: "book"
    location: "https://www.numdam.org/item/AST_1998__247__R1_0/"
    relationship: "formalizes"
    note: >-
      Page 106: the boundedness of the Rademacher projection on L^q(S_q) from type 2, by its
      argument (averaging, the embedding of l_q(S_q) in S_q, type 2), with explicit constants; the
      statement on the dual space is implicit there.
    author_endorsement: "not-contacted"
  - title: "Séries de variables aléatoires vectorielles indépendantes et propriétés géométriques des espaces de Banach"
    authors:
      - "Bernard Maurey"
      - "Gilles Pisier"
    id: "Studia Math. 58 (1976), 45-90"
    type: "paper"
    location: "https://doi.org/10.4064/sm-58-1-45-90"
    relationship: "background"
    note: >-
      Remark 2.10 (p. 88) states without proof that spaces of type 2 are K-convex.
    author_endorsement: "not-contacted"
  - title: "Multivariate trace inequalities"
    authors:
      - "David Sutter"
      - "Mario Berta"
      - "Marco Tomamichel"
    id: "Comm. Math. Phys. 352 (2017), 37-58; arXiv:1604.03023"
    type: "paper"
    location: "https://arxiv.org/abs/1604.03023"
    relationship: "background"
    note: >-
      The argument of its Theorem 3.1 proves the three lines theorem for Schatten norms that
      Tomczak-Jaegermann quotes from Gohberg and Krein.
    author_endorsement: "not-contacted"

