# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Type 2, K-convexity and the Schatten classes, in Lean"
  description: >-
    Lean 4 proofs, from Mathlib alone, of results on type 2 and K-convexity of normed spaces. Type 2
    and Gaussian type 2 are equivalent, with constants tau and (pi/2)^(1/2) tau, and a space of
    Gaussian type 2 with constant tau is K-convex in L^2 with constant (pi/2)^(1/2) tau (Hytönen,
    van Neerven, Veraar and Weis, "Analysis in Banach Spaces II", Propositions 7.1.18 (1) and
    7.4.22, for p = 2 and real Gaussian variables).


    The Schatten class S_q, q >= 2, has type 2 with the constant (q + 1)^(1/2), for real and complex
    square matrices of every size, even with the norm of L^q(S_q) on the left (Tomczak-Jaegermann
    1974, Theorem 3.1 (ii), with her constants M_{2k}^(1-theta) M_{2k+2}^theta). Hence the
    Rademacher projection on L^q(S_q) and on the dual space has norm at most (pi/2)^(1/2) (q +
    1)^(1/2), for real square matrices of every size (Pisier 1998).
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

classification:
  arxiv: ["math.FA", "math.PR"]
  msc2020: ["46B09", "46B20", "47B10", "60B11"]

sources:
