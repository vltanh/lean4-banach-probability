status:
  scope: >-
    Formalized (the theorems that Comparator checks, listed under alignment): for real signs and
    real Gaussian variables, type 2 of real inner product spaces with constant 1; that type 2 and
    Gaussian type 2 are equivalent, with constants; that Gaussian type 2, or type 2, gives
    K-convexity in L^2, with constants; type 2 of S_q, q >= 2, for real and complex square matrices
    of every size; the averaging from K-convexity of l_p(X) in L^2 to K-convexity of X in L^p; the
    Rademacher projection on L^q(S_q) and its dual, for real square matrices.


    Not formalized: complex Rademacher and Gaussian variables; types and exponents other than 2
    (Pisier's theorem that non-trivial type gives K-convexity, in particular); cotype, in particular
    Theorem 3.1 (i) of Tomczak-Jaegermann (cotype 2 of S_q, q <= 2); infinite-dimensional Schatten
    classes; complex matrices in the last two theorems; the identity of the two definitions of
    K-convexity (Proposition 7.4.5).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code 2.1.330 (VS Code extension, Claude Agent SDK)"
      tool_setup: >-
        The formalize-math-paper skill (https://github.com/vltanh/formalize-math-paper, version
        4.3.2, commit 8e884d5); Claude Code sessions and sub-agents that wrote the statements and
        the proofs of the library and compared them with the sources; the number of agents was not
        tracked for this library alone. This entry by one agent, with an independent reviewer agent.
        Lean v4.36.0-rc2, Mathlib v4.36.0-rc2.
      cost:
        wall_time: >-
          about 13 hours between the library's first commit and its last one before the entries
          (21-22 November 2026, git log), not continuous and with other work in parallel, and about
          1.5 hours for the eight entries of the package together, with the additions to the library
          that they needed and the review; agent time not tracked
        spend_usd: "not tracked"
        hardware: "local machine (20 cores, 62 GB RAM) and API"
      prompting_notes: >-
        Instructions: state the theorems of the cited sources in their general form as far as
        feasible, follow the sources' proofs, record every deviation, use only Mathlib.
  spend_usd: "not tracked"
  notes: >-
    The AI system wrote the code and the documents. No person has reviewed the statements or the
    proofs; Lean has checked the proofs. Independent AI agents compared the proofs of the library
    with the cited sources, and one compared the statements of this entry with them.

fidelity:
  divergences: >-
    Statements. Real signs and real Gaussian variables, also for complex spaces, whose constants are
    then those of the underlying real space (p. 56); finitely many variables, the coordinates of the
    sign cube and of a standard Gaussian vector; normed spaces, not assumed complete. Proposition
    7.1.18 (1) and the Gaussian type only for p = 2 and real standard Gaussian variables, where
    ||g||_2 = 1 and ||g||_1 = (2/pi)^(1/2); the two implications are stated for bounds and not for
    best constants. K-convexity is the boundedness of the Rademacher projections, Definition 7.4.4,
    for one exponent p; that its constant is the one of Definition 7.4.1 is Proposition 7.4.5, which
    is not formalized. Proposition 7.4.22 is stated for spaces of Gaussian type 2, as its proof
    gives, and for spaces of type 2. (In its proof in the book, "cotype 2 implies Gaussian cotype 2"
    is a misprint for type 2.) Theorem 3.1 (ii) of Tomczak-Jaegermann: square matrices of a finite
    size; the norm of L^q(S_q) is on the left, where her definition of type has that of L^1, with
    the constant of her proof; the constant (q + 1)^(1/2) is an upper bound for it. Pisier's p. 106:
    real square matrices, with the explicit constants; the dual statement is implicit there. Example
    7.1.2: real inner product spaces, the upper bound only, no cotype. The averaging of p. 106:
    l_p(X) with the counting measure, on finite cubes.


    Proofs. Those of the sources. In the even case of Theorem 3.1 (ii) the complex matrices are
    treated by realification; the additive Horn inequality, quoted there, is deduced from the
    multiplicative one; the three lines theorem needs a boundedness hypothesis that the source
    omits, and is proved by the argument of Sutter-Berta-Tomamichel. Theorem 7.1.20 (2) is used for
    orthonormal systems on finite sets with weights, and the rotation invariance of the Gaussian
    measure replaces the symmetry of the variables for fixed signs.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (independent agents)"
  notes: >-
    No human review. Independent AI agents compared the proofs of the library with the cited
    sources. Another one compared the statements of this entry, and this file, with them and found
    no wrong and no vacuous statement; its remarks on generality, citations and wording were
    followed, and it checked the corrected entry again, with a few further remarks on citations and
    wording, none on a theorem statement, which were followed.

alignment:
  namespace: "TypeTwoChallenge"
  statements:
    - source: "HNVW II, Example 7.1.2"
      lean: "TypeTwoChallenge.typeTwo_hilbert"
      module: "TypeTwo.Challenge"
      status: "partial"
      note: >-
        Real inner product spaces have type 2 with constant 1 (the upper bound), for real signs; the
        lower bound and cotype 2 are not formalized.
    - source: "HNVW II, Proposition 7.1.18 (1), p = 2"
      lean: "TypeTwoChallenge.gaussianTypeTwo_of_typeTwo"
      module: "TypeTwo.Challenge"
      status: "partial"
      note: >-
        The upper bound, for p = 2 and real Gaussian variables.
    - source: "HNVW II, Proposition 7.1.18 (1), p = 2"
      lean: "TypeTwoChallenge.typeTwo_of_gaussianTypeTwo"
      module: "TypeTwo.Challenge"
      status: "partial"
      note: >-
        The lower bound, for p = 2 and real Gaussian variables.
    - source: "HNVW II, Proposition 7.4.22"
      lean: "TypeTwoChallenge.kConvex_of_gaussianTypeTwo"
      module: "TypeTwo.Challenge"
      status: "proved"
      note: >-
        For real signs and Gaussian variables; K-convexity as the norm of the projections in L^2.
    - source: "HNVW II, Propositions 7.4.22 and 7.1.18 (1); Maurey-Pisier 1976, Remark 2.10"
      lean: "TypeTwoChallenge.kConvex_of_typeTwo"
      module: "TypeTwo.Challenge"
      status: "proved"
      note: >-
        With the constant (pi/2)^(1/2) tau.
    - source: "Pisier 1998, p. 106 (averaging)"
      lean: "TypeTwoChallenge.kConvex_of_piLp"
      module: "TypeTwo.Challenge"
      status: "adapted"
      note: >-
        From K-convexity of l_p({-1,1}^M; X) in L^2, for all M, to K-convexity of X in L^p, with the
        same constant; counting measure instead of the uniform probability.
    - source: "Tomczak-Jaegermann 1974, Theorem 3.1 (ii), end of the proof"
      lean: "TypeTwoChallenge.typeTwo_schatten_interp"
      module: "TypeTwo.Challenge"
      status: "partial"
      note: >-
        The constant of the source, complex square matrices (the source: compact operators).
    - source: "Tomczak-Jaegermann 1974, Theorem 3.1 (ii)"
      lean: "TypeTwoChallenge.typeTwo_schatten"
      module: "TypeTwo.Challenge"
      status: "partial"
      note: >-
        The constant (q + 1)^(1/2), real and complex square matrices (the source: compact
        operators).
    - source: "Pisier 1998, p. 106"
      lean: "TypeTwoChallenge.rademacherProj_schatten"
      module: "TypeTwo.Challenge"
      status: "adapted"
      note: >-
        Real square matrices of every size, with an explicit constant of the order q^(1/2).
    - source: "Pisier 1998, p. 106 (implicit)"
      lean: "TypeTwoChallenge.rademacherProj_schatten_conj"
      module: "TypeTwo.Challenge"
      status: "adapted"
      note: >-
        The dual statement, real square matrices.

