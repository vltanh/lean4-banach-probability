# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "The noncommutative Khintchine inequality, in Lean"
  description: >-
    Lean 4 proofs, from Mathlib alone, of the noncommutative Khintchine inequality of Lust-Piquard
    and of Lust-Piquard and Pisier (Pisier and Xu 2003, Theorem 6.1 (i)) for real square matrices
    x_1, ..., x_k and Schatten norms, q >= 2: with m the larger of the S_q norms of the row and
    column square functions (sum x_i x_i^T)^(1/2) and (sum x_i^T x_i)^(1/2), the L^q(S_q) norm of
    sum eps_i x_i, eps_i independent fair signs, lies between m and (2 (q - 1))^(1/2) m, for
    matrices of every size.


    The upper bound is proved by the method of exchangeable pairs of Mackey, Jordan, Chen, Farrell
    and Tropp (2014), whose constant (q - 1)^(1/2) for symmetric matrices, q = 2 and q >= 3 is also
    proved, and extended to all real square matrices.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

classification:
  arxiv: ["math.FA", "math.PR", "math.OA"]
  msc2020: ["46L53", "47B10", "15A60", "60B20", "60E15"]

sources:
  - title: "Matrix concentration inequalities via the method of exchangeable pairs"
    authors:
      - "Lester Mackey"
      - "Michael I. Jordan"
      - "Richard Y. Chen"
      - "Brendan Farrell"
      - "Joel A. Tropp"
    id: "Ann. Probab. 42 (2014), 906-945; arXiv:1201.6002"
    type: "paper"
    location: "https://doi.org/10.1214/13-AOP892"
    relationship: "formalizes"
    note: >-
      The Khintchine case of the matrix Burkholder-Davis-Gundy inequality: Corollary 7.3, (7.2), for
      real symmetric matrices, by its proof (Lemmas 2.4 and 3.4, Proposition 7.5), Remark 7.2 for 2
      < q < 3, with the variant of Lemma 3.4 that it needs and does not prove, and the Hermitian
      dilation of Section 8. Not formalized: the first inequality of Corollary 7.3 (independent
      Hermitian summands), and Theorem 7.1 itself.
    author_endorsement: "not-contacted"
  - title: "Non-commutative L^p-spaces"
    authors:
      - "Gilles Pisier"
      - "Quanhua Xu"
    id: "Handbook of the Geometry of Banach Spaces, vol. 2 (2003), 1459-1517"
    type: "paper"
    location: "https://doi.org/10.1016/s1874-5849(03)80041-4"
    relationship: "independently-proves"
    note: >-
      Theorem 6.1 (i), stated there without proof, for real square matrices and Schatten norms: the
      lower bound by the standard convexity argument, the upper one with an explicit constant by the
      method of Mackey et al.
    author_endorsement: "not-contacted"
  - title: "Inégalités de Khintchine dans C_p (1 < p < infinity)"
    authors:
      - "Françoise Lust-Piquard"
    id: "C. R. Acad. Sci. Paris Sér. I Math. 303 (1986), 289-292"
    type: "paper"
    location: "https://zbmath.org/?q=an:0592.47038"
    relationship: "background"
    note: >-
      The original theorem, for Schatten classes; its proof is not followed.
    author_endorsement: "not-contacted"
  - title: "Non commutative Khintchine and Paley inequalities"
    authors:
      - "Françoise Lust-Piquard"
      - "Gilles Pisier"
    id: "Ark. Mat. 29 (1991), 241-260"
    type: "paper"
    location: "https://doi.org/10.1007/BF02384340"
    relationship: "background"
    note: >-
      The general theorem, with p = 1; its proof is not followed.
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/tchen-research/NLAlib"
    relationship: "independent"
    note: >-
      Lean 4. The upper bound in S_{2p}, p a natural number, with the constant (2p - 1)^(1/2), for
      complex Hermitian matrices with signs or Gaussian variables; other exponents, matrices that
      are not Hermitian, and the lower bound were not seen there. (Search of 22 November 2026; read
      as text, not built. No code of it is used.)
  - id: "https://github.com/BuxinSu/LearningTheoryFormalizations"
    relationship: "independent"
    note: >-
      Lean 4. A matrix Khintchine inequality in operator norm, with a factor of the order of the
      square root of the logarithm of the dimension. (Search of 22 November 2026; read as text, not
      built. No code of it is used.)
  - id: "https://github.com/xf-shi/Tensor_Norm"
    relationship: "independent"
    note: >-
      Lean 4. A noncommutative Khintchine inequality in L^1 with Haar unitary coefficients. (Search
      of 22 November 2026; read as text, not built. No code of it is used.)

status:
  scope: >-
    Formalized (the 5 theorems that Comparator checks): the two-sided inequality for real square
    matrices of every size and q >= 2, with the constants 1 and (2 (q - 1))^(1/2); the upper bound
    with the constant (q - 1)^(1/2) for q = 2 and q >= 3, for real symmetric and for all real square
    matrices; two identities for Schatten norms that identify the square functions and the norm of
    S_2.


    Not formalized: complex and rectangular matrices; exponents below 2 (Theorem 6.1 (ii)); infinite
    families; infinite-dimensional Schatten classes and general von Neumann algebras; the optimal
    constants, and the optimality of the order; the matrix Burkholder-Davis-Gundy inequality for
    matrix Stein pairs (Theorem 7.1 of Mackey et al.) and sums of other independent matrices (the
    first inequality of their Corollary 7.3).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code 2.1.330 (VS Code extension, Claude Agent SDK)"
      tool_setup: >-
        The formalize-math-paper skill (https://github.com/vltanh/formalize-math-paper, version
        4.3.2, commit 8e884d5); Claude Code sessions and sub-agents that wrote the statements and
        the proofs of the library and compared them with the sources; the number of agents was not
        tracked for this library alone. This entry by one agent, with an independent reviewer agent.
        Lean v4.36.0-rc2, Mathlib v4.36.0-rc2.
      cost:
        wall_time: >-
          about 13 hours between the library's first commit and its last one before the entries
          (21-22 November 2026, git log), not continuous and with other work in parallel, and about
          1.5 hours for the eight entries of the package together, with the additions to the library
          that they needed and the review; agent time not tracked
        spend_usd: "not tracked"
        hardware: "local machine (20 cores, 62 GB RAM) and API"
      prompting_notes: >-
        Instructions: state the theorems of the cited sources in their general form as far as
        feasible, follow the sources' proofs, record every deviation, use only Mathlib.
  spend_usd: "not tracked"
  notes: >-
    The AI system wrote the code and the documents. No person has reviewed the statements or the
    proofs; Lean has checked the proofs. Independent AI agents compared the proofs of the library
    with the cited sources, and one compared the statements of this entry with them.

fidelity:
  divergences: >-
    Statements. Theorem 6.1 (i) of Pisier and Xu is for semifinite von Neumann algebras and has a
    constant that depends only on p; here for the algebra of real n x n matrices with the trace
    (Schatten norms), finite families, real signs, and the constant (2 (q - 1))^(1/2), of the order
    of the best one by the remarks after Theorem 6.1; the factor 2^(1/2) comes from Remark 7.2 of
    Mackey et al. and is used only for 2 < q < 3: the bound with (q - 1)^(1/2) for the other q is a
    separate theorem. The S_q norms of the square functions are written as the square roots of the
    S_{q/2} norms of the sums of squares, and the maximum of the two is the norm of the source's
    intersection space. The signs are the coordinates of the finite sign cube. Corollary 7.3 of
    Mackey et al.: only (7.2), the Rademacher sums, for real symmetric matrices instead of complex
    Hermitian ones, q = 2p, in the source's range q = 2 or q >= 3; its extension to all real square
    matrices is the dilation of their Section 8.


    Proofs. The upper bound by the method of exchangeable pairs (Mackey et al.), not by the
    factorisation theorem and the Paley inequality of Lust-Piquard and Pisier; a departure from the
    sources of the theorem, which the statement's source (Pisier and Xu) does not prove. Remark 7.2
    of Mackey et al. uses, for 2 < q < 3, a variant of their Lemma 3.4 that they do not prove; it is
    proved here. General matrices by the Hermitian dilation, as in their Section 8, with the factors
    2^(1/q) cancelling. The lower bound by the convexity of the S_{q/2} norm on positive
    semidefinite matrices and Jensen's inequality.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (independent agents)"
  notes: >-
    No human review. Independent AI agents compared the proofs of the library with the cited
    sources. Another one compared the statements of this entry, and this file, with them and found
    no wrong and no vacuous statement; its remarks on generality, citations and wording were
    followed, and it checked the corrected entry again, with a few further remarks on citations and
    wording, none on a theorem statement, which were followed.

alignment:
  namespace: "NoncommutativeKhintchineChallenge"
  statements:
    - source: "Pisier-Xu 2003, Theorem 6.1 (i)"
      lean: "NoncommutativeKhintchineChallenge.khintchine"
      module: "NoncommutativeKhintchine.Challenge"
      status: "partial"
      note: >-
        For real square matrices and Schatten norms, with an explicit constant; another proof.
    - source: "Mackey et al. 2014, Corollary 7.3, (7.2), and Section 8"
      lean: "NoncommutativeKhintchineChallenge.khintchine_of_eq_two_or_three_le"
      module: "NoncommutativeKhintchine.Challenge"
      status: "adapted"
      note: >-
        All real square matrices, the constant (q - 1)^(1/2), q = 2 or q >= 3.
    - source: "Mackey et al. 2014, Corollary 7.3, (7.2)"
      lean: "NoncommutativeKhintchineChallenge.khintchine_symmetric"
      module: "NoncommutativeKhintchine.Challenge"
      status: "partial"
      note: >-
        Real symmetric matrices, the source's constant (q - 1)^(1/2) and range q = 2 or q >= 3; not
        the first inequality of the corollary.
    - source: "a check of the definitions"
      lean: "NoncommutativeKhintchineChallenge.schattenNorm_transpose_mul_self"
      module: "NoncommutativeKhintchine.Challenge"
      status: "proved"
      note: >-
        The S_{q/2} norm of B^T B is the square of the S_q norm of B.
    - source: "a check of the definitions"
      lean: "NoncommutativeKhintchineChallenge.schattenNorm_two_sq"
      module: "NoncommutativeKhintchine.Challenge"
      status: "proved"
      note: >-
        The S_2 norm is the Frobenius norm.

acknowledgements: >-
  Mathlib; Lean's Comparator and the NanoDa kernel; Palomar's validation scripts.
