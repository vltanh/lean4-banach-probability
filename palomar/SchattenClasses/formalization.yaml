    authors:
      - "Narcisse Randrianantoanina"
    id: "J. Funct. Anal. 194 (2002), 181-212; arXiv:math/0111264"
    type: "paper"
    location: "https://doi.org/10.1006/jfan.2002.3952"
    relationship: "formalizes"
    note: >-
      Theorem 3.1, Theorem 4.3, Corollary 4.5 and Remark 4.6 (1) for the von Neumann algebras
      L^infinity(Omega, mu) tensor M_n(R), mu a probability, with scalar multipliers, by their
      proofs (read in the arXiv version). General semifinite von Neumann algebras are not
      formalized.
    author_endorsement: "not-contacted"
  - title: "Analysis in Banach Spaces, Volume I: Martingales and Littlewood-Paley Theory"
    authors:
      - "Tuomas Hytönen"
      - "Jan van Neerven"
      - "Mark Veraar"
      - "Lutz Weis"
    id: "Ergebnisse der Mathematik und ihrer Grenzgebiete (3) 63, Springer (2016)"
    type: "book"
    location: "https://doi.org/10.1007/978-3-319-48520-1"
    relationship: "formalizes"
    note: >-
      Appendix D: Proposition D.2.3 (p. 571), the inequality of Corollary D.2.4 (p. 572), and one
      inequality of Theorem D.2.6 (pp. 572-573, the first line of its proof), by their proofs, for
      real matrices; Hölder's inequality also for complex ones. In the proof of the bound in L^2,
      also Theorem 4.2.7 (p. 283; the entry UMD of this repository).
    author_endorsement: "not-contacted"
  - title: "The moduli of smoothness and convexity and the Rademacher averages of trace classes S_p (1 <= p < infinity)"
    authors:
      - "Nicole Tomczak-Jaegermann"
    id: "Studia Math. 50 (1974), 163-182"
    type: "paper"
    location: "https://zbmath.org/?q=an:0282.46016"
    relationship: "formalizes"
    note: >-
      Lemma 1.1 (pp. 165-166), by its proof, for real square matrices.
    author_endorsement: "not-contacted"
  - title: "Matrix triangle inequalities: past, present, and future"
    authors:
      - "Jean-Christophe Bourin"
      - "Teng Zhang"
    id: "arXiv:2610.30538 (2026)"
    type: "paper"
    location: "https://arxiv.org/abs/2610.30538"
    relationship: "formalizes"
    note: >-
      Proposition 3.13 by the third proof of Remark 3.14 (the Hermitian dilation), for real
      rectangular matrices, and for complex ones by realification; von Neumann's convexity
      inequality, which is quoted there, is proved by Peierls's argument.
    author_endorsement: "not-contacted"

