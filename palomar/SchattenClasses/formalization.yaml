status:
  scope: >-
    Formalized (the 12 theorems that Comparator checks), for finite matrices: the Schatten norms in
    terms of Mathlib's singular values; the triangle inequality for 1 <= q <= infinity, real and
    complex rectangular matrices; Horn's inequality for two real matrices and the general one for
    several real square matrices; Hölder's inequality for real and complex rectangular matrices and
    all positive finite exponents; the trace inequality; on L^infinity(Omega) tensor M_n(R), the
    weak type (1, 1) inequality and the bound on L^r(S_r) for transforms by predictable scalar
    multipliers; the UMD inequality of S_q in L^q and in L^2, for real and complex n x n matrices,
    uniformly in n.


    Not formalized: infinite-dimensional Schatten classes; general semifinite von Neumann algebras,
    complex matrices in the weak type inequality and in the bound of the transforms, and complex or
    non-scalar multipliers; the optimality of the orders of the constants (Remark 4.4 of
    Randrianantoanina); the factorisation in Corollary D.2.4 and the surjectivity and isometry in
    Theorem D.2.6; infinite exponents in Hölder's inequality. The noncommutative L^p spaces are not
    constructed: the statements are about matrix-valued functions.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code 2.1.330 (VS Code extension, Claude Agent SDK)"
      tool_setup: >-
        The formalize-math-paper skill (https://github.com/vltanh/formalize-math-paper, version
        4.3.2, commit 8e884d5); Claude Code sessions and sub-agents that wrote the statements and
        the proofs of the library and compared them with the sources; the number of agents was not
        tracked for this library alone. This entry by one agent, with an independent reviewer agent.
        Lean v4.36.0-rc2, Mathlib v4.36.0-rc2.
      cost:
        wall_time: >-
          about 13 hours between the library's first commit and its last one before the entries
          (21-22 November 2026, git log), not continuous and with other work in parallel, and about
          1.5 hours for the eight entries of the package together, with the additions to the library
          that they needed and the review; agent time not tracked
        spend_usd: "not tracked"
        hardware: "local machine (20 cores, 62 GB RAM) and API"
      prompting_notes: >-
        Instructions: state the theorems of the cited sources in their general form as far as
        feasible, follow the sources' proofs, record every deviation, use only Mathlib.
  spend_usd: "not tracked"
  notes: >-
    The AI system wrote the code and the documents. No person has reviewed the statements or the
    proofs; Lean has checked the proofs. Independent AI agents compared the proofs of the library
    with the cited sources, and one compared the statements of this entry with them.

fidelity:
  divergences: >-
    Statements. Randrianantoanina: the algebra is L^infinity(Omega, mu) tensor M_n(R), with
    conditional expectations of any filtration applied entrywise (the source's proof of Corollary
    4.5), real matrices instead of complex ones; the multipliers are scalar functions, predictable
    and bounded by 1, which for this algebra are the ones of Theorem 3.1 (its multipliers are
    elements of the algebra at time n - 1 that commute with the algebra at time n); for complex
    matrices those are the complex scalar functions, of which only the real ones are treated here.
    The martingales are finite, x_k = E_k x for an integrable x, and the weak type inequality has
    the norm (or the trace) of x on the right, where the source has x_N = E_N x; x need not be
    measurable for the last algebra. The weak L^1 quasi-norm is written out, with the distribution
    function as the integral of the number of singular values above the level. The constants are
    explicit: 26 for positive semidefinite x and 52 for all x, where the source has an unspecified C
    and, in the proof for x >= 0, the infimum of 24/(alpha beta^2) + 2/(1 - alpha), printed as 14
    sqrt(3)/3 + 28 (its value is 26 + 8 sqrt(3)). Theorem 4.3: transforms by predictable scalar
    multipliers of modulus at most 1 instead of constant signs; the bound K r* with K = 192 * 864^3
    instead of C r^2/(r - 1), which it implies; x is measurable for the last algebra. Corollary 4.5
    and Remark 4.6 (1): the UMD inequality for matrix-valued martingales (every entry a martingale)
    started at 0, with predictable signs, on probability spaces in the universe Type, for n x n
    matrices with n in Type; Remark 4.6 (1) has the order O(p) for the constant in L^2 as p tends to
    infinity, here C (q* - 1) for all 1 < q < infinity. HNVW: Proposition D.2.3 and Theorem D.2.6
    for finite real matrices (compact operators there); Corollary D.2.4 for all positive exponents
    (there at least 1), real and complex. (Its inequality has a misprint: the second norm is that of
    C^r.) Tomczak-Jaegermann's Lemma 1.1 for real square matrices. The triangle inequality:
    Proposition 3.13 of Bourin-Zhang is about complex square matrices; here for real and complex
    rectangular ones.


    Proofs. Those of the sources, with these departures: a rank count in place of Lemma 3.2 of
    Randrianantoanina, hence the constants; general matrices by the Hermitian dilation; the
    interpolation and the duality in Theorem 4.3, which the source does not write out, in three
    regimes so that the constant stays uniform near r = 2; complex matrices by realification (also
    in the triangle inequality and in Hölder's inequality); UMD_2 <= 200 UMD_q (HNVW I, Theorem
    4.2.7, in place of the source's Theorem 4.2) for Remark 4.6 (1). In the triangle inequality the
    case q = infinity, which the source calls well known, is the first of Weyl's inequalities. In
    Corollary D.2.4 the vanishing singular values are treated separately. The additive Horn
    inequality, quoted by Tomczak-Jaegermann, is deduced from the multiplicative one.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (independent agents)"
  notes: >-
    No human review. Independent AI agents compared the proofs of the library with the cited
    sources. Another one compared the statements of this entry, and this file, with them and found
    no wrong and no vacuous statement; its remarks on generality, citations and wording were
    followed, and it checked the corrected entry again, with a few further remarks on citations and
    wording, none on a theorem statement, which were followed.

