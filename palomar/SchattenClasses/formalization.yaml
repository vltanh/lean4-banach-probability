version: "v0.4"

project:
  name: "Schatten classes and noncommutative martingale transforms, in Lean"
  description: >-
    Lean 4 proofs, from Mathlib alone, for finite matrices. Schatten norms: the triangle inequality,
    Horn's inequalities for the singular values of products, Hölder's inequality (Hytönen, van
    Neerven, Veraar and Weis, "Analysis in Banach Spaces I", Appendix D; Tomczak-Jaegermann 1974,
    Lemma 1.1; Bourin and Zhang 2026).


    Martingale transforms by predictable scalar multipliers on L^infinity(Omega) tensor M_n(R),
    after Randrianantoanina (2002): they are of weak type (1, 1), with the constant 52 (26 for
    positive semidefinite functions), and bounded on L^r(S_r), 1 < r < infinity, by an absolute
    constant times r* = max(r, r/(r - 1)). Consequently the Schatten classes S_q of real and complex
    n x n matrices are UMD with UMD_q(S_q) <= K q* and UMD_2(S_q) <= C (q* - 1), with constants that
    do not depend on q and n.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

classification:
  arxiv: ["math.OA", "math.FA", "math.PR"]
  msc2020: ["46L53", "46L52", "47B10", "15A18", "15A60", "60G42"]

sources:
