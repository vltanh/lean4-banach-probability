      module: "ZigZag.Challenge"
      status: "proved"
      note: >-
        For a fixed p.
    - source: "HNVW I, Theorem 4.5.6, last clause, real scalars"
      lean: "ZigZagChallenge.isLeast_signZigZag"
      module: "ZigZag.Challenge"
      status: "proved"
      note: >-
        For X other than 0; the infimum is attained.
    - source: "Yaroslavtsev 2018, Proposition 3.7 (A = [-1, 1])"
      lean: "ZigZagChallenge.umd_iff_ballZigZag"
      module: "ZigZag.Challenge"
