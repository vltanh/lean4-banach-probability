name = "BanachProbability"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["BanachProbability", "Palomar"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc2"

[[lean_lib]]
name = "BanachProbability"
globs = ["BanachProbability.*"]

# The Challenge and the Solution of each Palomar entry, as the modules `Burkholder.Challenge`,
# `Burkholder.Solution`, ... of the source directory `palomar/`.
[[lean_lib]]
name = "Palomar"
srcDir = "palomar"
globs = [
  "Burkholder.+",
  "Decoupling.+",
  "KahaneKhintchine.+",
  "NoncommutativeKhintchine.+",
  "SchattenClasses.+",
  "TypeTwo.+",
  "UMD.+",
  "ZigZag.+",
]
